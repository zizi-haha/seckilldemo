spring:
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      pool-name: DateHikariCP
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000
    session:
      store-type: redis
      timeout: 1800


  rabbitmq:

    host: 192.168.10.5

    username: guest

    password: guest
    # 虚拟主机
    virtual-host: /
    # 端口
    port: 5672
    listener:
      simple:
        # 消费者最小数量
        concurrency: 10
        # 消费者最大数量
        max-concurrency: 10
        # 限制消费者每次只处理一条消息，处理完再继续下一条消息
        prefetch: 1
        # 启动时是否默认启动容器，默认 true
        auto-startup: true
        # 被拒绝时重新进入队列
        default-requeue-rejected: true
    template:
      retry:
        # 发布重试，默认 false
        enabled: true
        # 重试时间，默认 1000ms
        initial-interval: 1000ms
        # 重试最大次数，默认 3 次
        max-retries: 3
        # 重试最大间隔时间，默认 10000ms
        max-interval: 10000ms
        # 重试的间隔乘数。比如配 2.0，第一次就等 10s，第二次就等 20s，第三次就等 40s
        multiplier: 1

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-aliases-package: com.yr.seckilldemo.pojo

logging:
  level:
    com.yr.seckilldemo: info

