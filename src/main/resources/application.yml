spring:
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:123456}"
    hikari:
      pool-name: DateHikariCP
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000
    session:
      store-type: redis
      timeout: 1800

  threads:
    virtual:
      enabled: false

  rabbitmq:


    host: ${RABBITMQ_HOST:192.168.10.5}

    username: ${RABBITMQ_USERNAME:guest}

    password: "${RABBITMQ_PASSWORD:guest}"

    # 虚拟主机
    virtual-host: /
    # 端口
    port: 5672
    listener:
      simple:
        # 消费者最小数量
        concurrency: 10
        # 消费者最大数量
        max-concurrency: 10
        # 限制消费者每次只处理一条消息，处理完再继续下一条消息
        prefetch: 1
        # 启动时是否默认启动容器，默认 true
        auto-startup: true
        # 被拒绝时重新进入队列
        default-requeue-rejected: false
    template:
      retry:
        # 发布重试，默认 false
        enabled: true
        # 重试时间，默认 1000ms
        initial-interval: 1000ms
        # 重试最大次数，默认 3 次
        max-retries: 3
        # 重试最大间隔时间，默认 10000ms
        max-interval: 10000ms
        # 重试的间隔乘数。比如配 2.0，第一次就等 10s，第二次就等 20s，第三次就等 40s
        multiplier: 1
server:
  tomcat:
    accept-count: 1000
    max-connections: 10000
# 滑块验证码配置， 详细请看 cloud.tianai.captcha.autoconfiguration.ImageCaptchaProperties 类
captcha:
  # 如果项目中使用到了redis，滑块验证码会自动把验证码数据存到redis中， 这里配置redis的key的前缀,默认是captcha:slider
  prefix: captcha
  # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
  expire:
    # 默认缓存时间 2分钟
    default: 10000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 20000
  # 使用加载系统自带的资源， 默认是 false
  init-default-resource: true
  # 缓存控制， 默认为false不开启
  local-cache-enabled: true
  # 验证码会提前缓存一些生成好的验证数据， 默认是20
  local-cache-size: 20
  # 缓存拉取失败后等待时间 默认是 5秒钟
  local-cache-wait-time: 5000
  # 缓存检查间隔 默认是2秒钟
  local-cache-period: 2000
  # 配置字体库，文字点选验证码的字体库，可以配置多个
  font-path:
    - classpath:font/simhei.ttf
  secondary:
    # 二次验证， 默认false 不开启
    enabled: false
    # 二次验证过期时间， 默认 2分钟
    expire: 120000
    # 二次验证缓存key前缀，默认是 captcha:secondary
    keyPrefix: "captcha:secondary"




mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-aliases-package: com.yr.seckilldemo.pojo

logging:
  level:
    com.yr.seckilldemo: info

