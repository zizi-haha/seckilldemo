<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${goodsDetail != null ? goodsDetail.goodsName : '商品详情'}">商品详情</title>
    <link rel="stylesheet" th:href="@{/css/seckill.css}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/goods/toDetail}">
            <span class="brand-mark">秒</span>
            <span>限时秒杀</span>
        </a>
        <div class="header-actions" data-user-actions>
            <a class="header-link" th:href="@{/user/settings}" data-settings-link hidden>账号设置</a>
            <span class="user-chip" data-user-name hidden>用户</span>
            <a class="header-link primary" th:href="@{/tologin}" data-login-link>登录</a>
        </div>
    </div>
</header>

<main class="page-shell">
    <div class="section-head">
        <div>
            <h1 th:text="${goodsDetail != null ? goodsDetail.goodsName : '商品不存在'}">商品详情</h1>
            <p>秒杀库存与活动时间实时同步</p>
        </div>
        <a class="text-button" th:href="@{/goods/toDetail}">返回列表</a>
    </div>

    <section class="detail-layout" th:if="${goodsDetail != null}">
        <div class="detail-media">
            <img th:src="${#strings.startsWith(goodsDetail.goodsImg, 'http') ? goodsDetail.goodsImg : '/' + goodsDetail.goodsImg}"
                 th:alt="${goodsDetail.goodsName}">
        </div>

        <div class="detail-panel">
            <h1 th:text="${goodsDetail.goodsName}">商品名称</h1>
            <p class="detail-summary" th:text="${goodsDetail.goodsTitle} ?: '限时秒杀商品'">商品标题</p>

            <div class="detail-price">
                <strong>
                    <small>¥</small>
                    <span th:text="${#numbers.formatDecimal(goodsDetail.seckillPrice, 1, 2)}">0.00</span>
                </strong>
                <small th:text="'原价 ¥' + ${#numbers.formatDecimal(goodsDetail.goodsPrice, 1, 2)}">原价</small>
            </div>

            <div class="detail-meta">
                <div>
                    <span>秒杀库存</span>
                    <strong th:text="${goodsDetail.stockCount} + ' 件'">0 件</strong>
                </div>
                <div>
                    <span>商品库存</span>
                    <strong th:text="${goodsDetail.goodsStock} + ' 件'">0 件</strong>
                </div>
                <div>
                    <span>开始时间</span>
                    <strong th:text="${goodsDetail.startTime}">--</strong>
                </div>
                <div>
                    <span>结束时间</span>
                    <strong th:text="${goodsDetail.endTime}">--</strong>
                </div>
            </div>

            <div class="time-cell"
                 data-countdown
                 th:attr="data-start=${goodsDetail.startTime},
                          data-end=${goodsDetail.endTime},
                          data-stock=${goodsDetail.stockCount}">
                <span class="label" data-detail-countdown-label>距开始</span>
                <span class="value" data-detail-countdown-value>--:--:--</span>
            </div>

            <p class="detail-summary" th:text="${goodsDetail.goodsDetail}">商品详情</p>

            <div class="detail-actions">
                <form class="buy-form" th:action="@{/seckill/doseckill}" method="post">
                    <input type="hidden" name="goodsid" th:value="${goodsDetail.id}">
                    <button class="primary-button" type="submit" data-detail-buy-button disabled>即将开始</button>
                </form>
                <a class="text-button" th:href="@{/goods/toDetail}">继续浏览</a>
            </div>
        </div>
    </section>
</main>

<script th:src="@{/js/seckill.js}"></script>
</body>
</html>
