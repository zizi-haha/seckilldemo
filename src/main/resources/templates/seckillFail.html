<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>秒杀未成功</title>
    <link rel="stylesheet" th:href="@{/css/seckill.css}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/goods/toDetail}">
            <span class="brand-mark">秒</span>
            <span>限时秒杀</span>
        </a>
    </div>
</header>

<main class="result-page">
    <section class="result-panel">
        <div class="result-icon fail">!</div>
        <h1>未抢购成功</h1>
        <p class="panel-copy" th:text="${message} ?: '当前商品暂时无法购买'">当前商品暂时无法购买</p>
        <div class="result-actions">
            <a class="primary-button" th:href="@{/goods/toDetail}">返回商品列表</a>
            <a class="text-button"
               th:if="${goods != null}"
               th:href="@{'/goods/toList/' + ${goods.id}}">查看商品</a>
        </div>
    </section>
</main>
</body>
</html>
