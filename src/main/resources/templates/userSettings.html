<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>账号设置</title>
    <link rel="stylesheet" th:href="@{/css/seckill.css}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/goods/toDetail}">
            <span class="brand-mark">秒</span>
            <span>限时秒杀</span>
        </a>
        <div class="header-actions">
            <span class="user-chip" th:text="${user.username}">用户</span>
            <a class="header-link" th:href="@{/goods/toDetail}">返回商品</a>
        </div>
    </div>
</header>

<main class="settings-page">
    <div class="settings-heading">
        <div>
            <h1>账号设置</h1>
            <p>当前登录手机号：<strong th:text="${user.id}">--</strong></p>
        </div>
    </div>

    <section class="settings-grid">
        <article class="settings-panel">
            <div class="settings-panel-head">
                <div>
                    <h2>登录手机号</h2>
                    <p>手机号同时作为登录账号，修改后需要重新登录。</p>
                </div>
            </div>

            <form data-settings-form
                  th:action="@{/user/updateId}"
                  method="post">
                <div class="field">
                    <label for="phone">新手机号</label>
                    <input id="phone"
                           name="id"
                           type="tel"
                           inputmode="numeric"
                           autocomplete="tel"
                           pattern="1[3-9][0-9]{9}"
                           maxlength="11"
                           placeholder="请输入新的11位手机号"
                           required>
                </div>
                <button class="primary-button" type="submit">修改手机号</button>
                <p class="form-message" data-form-message role="alert"></p>
            </form>
        </article>

        <article class="settings-panel">
            <div class="settings-panel-head">
                <div>
                    <h2>登录密码</h2>
                    <p>新密码为6到20位，修改后需要重新登录。</p>
                </div>
            </div>

            <form data-settings-form
                  th:action="@{/user/updatePassword}"
                  method="post">
                <div class="field">
                    <label for="oldPassword">原密码</label>
                    <input id="oldPassword"
                           name="oldPassword"
                           type="password"
                           autocomplete="current-password"
                           placeholder="请输入当前密码"
                           required>
                </div>
                <div class="field">
                    <label for="newPassword">新密码</label>
                    <input id="newPassword"
                           name="password"
                           type="password"
                           autocomplete="new-password"
                           minlength="6"
                           maxlength="20"
                           placeholder="请输入新密码"
                           required>
                </div>
                <div class="field">
                    <label for="confirmPassword">确认新密码</label>
                    <input id="confirmPassword"
                           type="password"
                           autocomplete="new-password"
                           data-confirm-for="password"
                           minlength="6"
                           maxlength="20"
                           placeholder="请再次输入新密码"
                           required>
                </div>
                <button class="primary-button" type="submit">修改密码</button>
                <p class="form-message" data-form-message role="alert"></p>
            </form>
        </article>
    </section>
</main>

<script th:src="@{/js/seckill.js}"></script>
</body>
</html>
